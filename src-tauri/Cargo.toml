[package]
name = "quikclip"
version = "0.1.0"
edition = "2021"
description = "A local-first video clipping studio"
license = "GPL-3.0-only"
repository = "https://github.com/kerjakuyco/quikclip"

[lib]
name = "quikclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tokio = { version = "1", features = ["process", "time", "fs", "sync", "macros", "io-util", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
base64 = "0.22"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Media_FaceAnalysis",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Win32_System_Com",
] }

[dev-dependencies]
tiny_http = "0.12"
