[package]
name = "quikclip"
version = "0.1.0"
edition = "2021"
description = "A local-first video clipping studio"
license = "GPL-3.0-only"
repository = "https://github.com/kerjakuyco/quikclip"

[lib]
name = "quikclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tokio = { version = "1", features = ["process", "time", "fs", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
base64 = "0.22"
tempfile = "3"
